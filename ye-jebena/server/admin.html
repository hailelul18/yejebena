<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ye’ Jebena — Review moderation</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;background:#f6eee0;color:#2b2019;margin:0;padding:1.2rem}
main{max-width:860px;margin:auto}h1{font-size:1.5rem;margin:.2rem 0}
.rule{background:#fffdf9;border-left:4px solid #c9a24a;padding:.8rem 1rem;border-radius:8px;margin:1rem 0;font-size:.92rem}
.tabs{display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap}
.tabs button{border:1.5px solid #4a2c1a;background:none;border-radius:99px;padding:.4rem 1rem;cursor:pointer;font:inherit}
.tabs button.on{background:#4a2c1a;color:#fff}
.r{background:#fffdf9;border-radius:12px;padding:1rem;margin:.7rem 0;box-shadow:0 4px 14px -8px #0005}
.r header{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.st{color:#c9a24a;letter-spacing:2px}.meta{color:#6f5f52;font-size:.85rem}
.badge{font-size:.75rem;padding:.1rem .6rem;border-radius:99px;background:#eadcc4;text-transform:uppercase}
.badge.pending{background:#f7e3a1}.badge.approved{background:#cfe6d3}.badge.hidden{background:#e8cfcf}
.r p{white-space:pre-wrap;overflow-wrap:anywhere;margin:.5rem 0}
.act button{margin-right:.4rem;border:0;border-radius:8px;padding:.45rem .9rem;cursor:pointer;font:inherit;color:#fff}
.ok{background:#2f5a3a}.hide{background:#7a4a2c}.del{background:#a1202a}
</style></head><body><main>
<h1>Review moderation</h1>
<div class="rule"><b>Fair-moderation rule:</b> approve or hide reviews based only on whether they are spam, abusive, off-topic, contain personal data or are not from a real guest — never because of the star rating or because the review is critical. Customers can always post on Google regardless.</div>
<div class="tabs" id="tabs"></div><div id="list">Loading…</div>
</main>
<script>
const tabs=['pending','approved','hidden','all']; let cur='pending', data=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/api/admin/reviews');data=(await r.json()).reviews;render()}
function render(){
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${t===cur?'on':''}" onclick="cur='${t}';render()">${t[0].toUpperCase()+t.slice(1)} (${t==='all'?data.length:data.filter(x=>x.status===t).length})</button>`).join('');
  const rows=data.filter(x=>cur==='all'||x.status===cur);
  document.getElementById('list').innerHTML=rows.length?rows.map(r=>`<div class="r"><header><div><b>${esc(r.name)}</b> <span class="st">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div><div><span class="badge ${r.status}">${r.status}</span> <span class="meta">${esc(new Date(r.created_at).toLocaleString())}</span></div></header>${r.text?`<p>${esc(r.text)}</p>`:'<p class="meta">(no written feedback)</p>'}<div class="act">${r.status!=='approved'?`<button class="ok" onclick="act(${r.id},'approve')">Approve</button>`:''}${r.status!=='hidden'?`<button class="hide" onclick="act(${r.id},'hide')">Hide</button>`:''}<button class="del" onclick="if(confirm('Delete permanently?'))act(${r.id},'delete')">Delete</button></div></div>`).join(''):'<p>Nothing here.</p>';
}
async function act(id,a){await fetch(`/api/admin/reviews/${id}/${a}`,{method:'POST'});load()}
load();
</script></body></html>
